<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazzate per Capa Spiaggia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #87CEEB 0%, #FFD700 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 700px;
            width: 100%;
        }

        .beach-header {
            margin-bottom: 30px;
            position: relative;
        }

        .sun {
            font-size: 80px;
            animation: pulse 2s ease-in-out infinite;
            margin-bottom: 15px;
        }

        .umbrella {
            font-size: 100px;
            margin-bottom: 15px;
            display: inline-block;
            animation: sway 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @keyframes sway {
            0%, 100% {
                transform: rotate(-2deg);
            }
            50% {
                transform: rotate(2deg);
            }
        }

        h1 {
            color: #FF6347;
            font-size: 36px;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            font-weight: bold;
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .option-btn {
            padding: 30px 20px;
            border: none;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            min-height: 200px;
            justify-content: center;
        }

        .option-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .option-btn:active {
            transform: translateY(-2px);
        }

        .baseball {
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
        }

        .baseball:hover {
            background: linear-gradient(135deg, #A0522D 0%, #CD853F 100%);
        }

        .boxing {
            background: linear-gradient(135deg, #DC143C 0%, #FF1493 100%);
        }

        .boxing:hover {
            background: linear-gradient(135deg, #FF1493 0%, #FF69B4 100%);
        }

        .spranga {
            background: linear-gradient(135deg, #696969 0%, #808080 100%);
        }

        .spranga:hover {
            background: linear-gradient(135deg, #808080 0%, #A9A9A9 100%);
        }

        .emoji-icon {
            font-size: 60px;
        }

        .option-text {
            font-size: 18px;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            font-size: 20px;
            font-weight: bold;
            animation: fadeIn 0.5s ease;
        }

        .result.show {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .result-baseball {
            background: #D2691E;
            color: white;
        }

        .result-boxing {
            background: #FF1493;
            color: white;
        }

        .result-spranga {
            background: #696969;
            color: white;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }

            .sun {
                font-size: 60px;
            }

            .umbrella {
                font-size: 80px;
            }

            .option-btn {
                min-height: 150px;
                font-size: 20px;
            }

            .emoji-icon {
                font-size: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="beach-header">
            <div class="sun">☀️</div>
            <div class="umbrella">🏖️</div>
        </div>

        <h1>🎯 Mazzate per Capa Spiaggia 🎯</h1>

        <div class="options-container">
            <button class="option-btn baseball" onclick="selectWeapon('baseball')">
                <span class="emoji-icon">⚾</span>
                <span class="option-text">Mazza da Baseball</span>
            </button>

            <button class="option-btn boxing" onclick="selectWeapon('boxing')">
                <span class="emoji-icon">🥊</span>
                <span class="option-text">Guantone da Boxe</span>
            </button>

            <button class="option-btn spranga" onclick="selectWeapon('spranga')">
                <span class="emoji-icon">🔧</span>
                <span class="option-text">Spranga</span>
            </button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script>
        const messages = {
            baseball: [
                "💥 PAM! Una mazzata perfetta!",
                "⚾ CRACK! Che colpo!",
                "🎯 BOOM! Diretto al bersaglio!",
                "⚾ SPLAT! Una vera mazzata!"
            ],
            boxing: [
                "👊 POW! Pugno devastante!",
                "🥊 BAM! Colpo da KO!",
                "💪 WHAM! Che gancio!",
                "🥊 SOCK! Un destro perfetto!"
            ],
            spranga: [
                "🔧 WHACK! La spranga colpisce!",
                "⚡ CRASH! Un colpo secco!",
                "🔧 BANG! Che botta!",
                "⚙️ CLANG! Metallico e letale!"
            ]
        };

        function selectWeapon(weapon) {
            const resultDiv = document.getElementById('result');
            const messageList = messages[weapon];
            const randomMessage = messageList[Math.floor(Math.random() * messageList.length)];
            
            resultDiv.textContent = randomMessage;
            resultDiv.className = `result show result-${weapon}`;

            // Animazione di vibrazione
            document.body.style.animation = 'none';
            setTimeout(() => {
                document.body.style.animation = 'shake 0.5s';
            }, 10);
        }

        // Aggiunta animazione di vibrazione
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
